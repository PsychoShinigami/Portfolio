<html>
    <head>
        <link rel="stylesheet" href="explore_path.css">
    </head>
    <body>
        <div class="main-container">
            <div class="header">
                <div class="logo">
                    <h1 class="logo-text">Coder <span class="logo-text2">Help</span></h1>
                </div>
                <div class="menu-boxes">
                    <div class="menu-box">
                        <h3 class="menu1">[Dashboard]</h3>
                    </div>
                    <div class="menu-box">
                        <h3 class="menu2">[Explore Paths]</h3>
                    </div>
                    <div class="menu-box">
                        <h3 class="menu3">[Video Library]</h3>
                    </div>
                    <div class="menu-box">
                        <h3 class="menu4">[Sign Out]</h3>
                    </div>
                </div>
            </div>
            <div class="welcome">
                <div class="wel-txt">
                    <h1 class="wel-title">Discover Your Next Challenge</h1>
                    <h3 class="wel-desc">Explore curated learning paths to define your tech career.</h3>
                </div>
                <div class="wel-img2">
                    <img src="laptop_ch.svg" class="laptop-img" alt="Neon Rocket">
                </div>
            </div>
            <div class="filter-box">
                <div class="search-box">
                    <input class="search-bar" type="text" placeholder="Search">
                    <span class="search-icon">🔍</span>
                </div>
                <div class="filter-options">
                    <h3 class="filter-txt">Filter:</h3>
                    <button class="f-btn">Web</button>
                    <button class="f-btn">Frontend</button>
                    <button class="f-btn">Backend</button>
                    <button class="f-btn">Python</button>
                    <button class="f-btn">AI/ML</button>
                </div>
            </div>
            <div class="paths-box">
                <div class="path">
                    <div class="lang-img">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Python-logo-notext.svg/960px-Python-logo-notext.svg.png" class="py-img" alt="py-img">
                    </div>
                    <div class="lang-desc">
                        <div class="desc-title">
                            <h3 class="core-track">CORE TRACK</h3>
                        </div>
                        <div class="desc-name">
                            <h3 class="lang-name">Python</h3>
                        </div>
                        <div class="desc-bar">
                            <div class="progress-bar"></div>
                        </div>
                        <div class="bar-value">
                            <h4 class="bar-data">0% </h4>
                            <h4 class="bar-data2">40 Total Lessons</h4>
                        </div>
                        <div class="explore-track">
                            <button class="explore-btn">Explore Track ></button>
                        </div>
                    </div>
                </div>
                <div class="path">
                    <div class="lang-img">
                        <img src="web-img.svg" class="web-img" alt="web-img">
                    </div>
                    <div class="lang-desc">
                        <div class="desc-title">
                            <h3 class="core-track">CORE TRACK</h3>
                        </div>
                        <div class="desc-name">
                            <h3 class="lang-name">Web Development</h3>
                        </div>
                        <div class="desc-bar">
                            <div class="progress-bar"></div>
                        </div>
                        <div class="bar-value">
                            <h4 class="bar-data">0% </h4>
                            <h4 class="bar-data2">60 Total Lessons</h4>
                        </div>
                        <div class="explore-track">
                            <button class="explore-btn">Explore Track ></button>
                        </div>
                    </div>
                </div>
                <div class="path"></div>
                <div class="path"></div>
                <div class="path"></div>
                <div class="path"></div>
                <div class="path"></div>
                <div class="path"></div>
                <div class="path"></div>
                <div class="path"></div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
