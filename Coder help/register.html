<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="overlay">
            <div class="login">
                <div class="txt-box">
                    <h2 class="login-txt">Sign Up</h2>
                </div>
                <div class="name-box">
                    <input type="text" class="name" placeholder="Name">
                </div>
                <div class="email-box">
                    <input type="text" class="email" placeholder="Email">
                </div>
                <div class="pass-box">
                    <input type="password" class="pass" id="pass1" placeholder="Password">
                </div>
                <div class="pass-box">
                    <input type="password" class="pass" id="pass2" placeholder="Confirm Password">
                </div>
                <div class="submit-box">
                    <button class="submit-btn" id="register-btn">Sign Up</button>
                </div>
                <div class="signUp">
                    <h4 class="signUp-txt">Already have an account? <a class="signUp-link" href="index.html">Sign In</a></h4>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
